<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1135.4629999999997 125.80000000000001" width="1135.4629999999997" height="125.80000000000001" style="--bg:#F8FAFC;--fg:#172033;--line:#64748B;--accent:#0F766E;--muted:#475569;--surface:#FFFFFF;--border:#94A3B8;background:var(--bg)">
<style>
  text { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .edge { stroke: #64748B !important; }
  .node rect { fill: #FFFFFF !important; stroke: #94A3B8 !important; }
  .node text { fill: #172033 !important; }
  marker polygon { fill: #0F766E !important; stroke: #0F766E !important; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<rect width="100%" height="100%" fill="#F8FAFC" />
